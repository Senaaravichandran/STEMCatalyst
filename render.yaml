# Render Build & Deploy Configuration
# =====================================
# Backend: Python Flask on Render Web Service
# Frontend: React (deploy separately or serve static build)

services:
  - type: web
    name: stemcatalyst-api
    env: python
    region: oregon
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "False"
      - key: FLASK_ENV
        value: "production"
      - key: PYTHON_VERSION
        value: "3.11.0"
